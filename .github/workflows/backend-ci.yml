name: Backend CI

on:
  push:
    branches-ignore:
      - 'gh-pages'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    name: Compile, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        # app-service is compiled with JDK 21 (see backend/app-service/pom.xml
        # and its Dockerfile which uses maven:3.9.6-eclipse-temurin-21).
        # Other modules target Java 17 in their POM, but the toolchain must
        # be able to produce Java 21 bytecode too, so we install JDK 21 in CI.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile all modules
        working-directory: backend
        run: mvn -B -ntp compile

      - name: Run unit tests + generate coverage
        working-directory: backend
        # `verify` triggers surefire (unit tests) and then JaCoCo's `report`
        # execution, producing target/site/jacoco/index.html for every module
        # that has tests. Spring Initializr's *ApplicationTests are excluded
        # via surefire config in the parent pom.
        run: mvn -B -ntp verify

      - name: Package (skip tests, already ran)
        working-directory: backend
        run: mvn -B -ntp package -DskipTests

      - name: Publish test results
        # Surface failing tests in the PR checks UI without needing to open
        # the raw log. `if: always()` so the report is uploaded even when a
        # test failure caused the previous step to exit non-zero.
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit tests
          path: 'backend/**/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: backend/*/target/*.jar
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: 'backend/**/target/site/jacoco/**'
          retention-days: 14
          if-no-files-found: ignore
