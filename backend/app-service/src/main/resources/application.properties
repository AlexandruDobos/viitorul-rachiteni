spring.application.name=app-service
server.port=8082

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.profiles.active=dev

# JWT
jwt.secret=${JWT_SECRET}

# Actuator (health + info for uptime monitors / Docker healthchecks).
# We do NOT expose sensitive endpoints (env, beans, heapdump, ...) — only
# what an external monitor legitimately needs. `health` shows liveness +
# readiness; `info` exposes build metadata baked in by the build plugin.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
