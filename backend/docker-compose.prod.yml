version: "3.8"

services:
  auth-service:
    env_file:
      - ./auth-service/.env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - postgres
    restart: unless-stopped

  app-service:
    env_file:
      - ./app-service/.env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - postgres
    restart: unless-stopped

  donations-service:
    env_file:
      - ./donations-service/.env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - postgres
    restart: unless-stopped

  gateway:
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped

  email-service:
    env_file:
      - ./email-service/.env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - rabbitmq
    restart: unless-stopped

  # Reverse proxy + TLS termination for api.viitorulrachiteni.ro and pgadmin.viitorulrachiteni.ro
  # nginx.conf, vhosts, htpasswd and TLS cert are provided on the host and mounted read-only.
  nginx:
    image: nginx:1.27.5
    restart: unless-stopped
    depends_on:
      - gateway
      - pgadmin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: viitorul-rachiteni
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
